name: Build BetterPOV 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch native SpectatorPlus 1.21.11 source
        run: |
          curl -fsSL https://github.com/hpfxd/SpectatorPlus/archive/945b1938450c07631b0eb8b0d878b09c4218156e.zip -o spectatorplus.zip
          unzip -q spectatorplus.zip
          mv SpectatorPlus-945b1938450c07631b0eb8b0d878b09c4218156e source

      - name: Fix Paper-to-Fabric item packet decoding
        working-directory: source
        run: |
          echo '' | base64 --decode > fabric/fabric-core/src/main/java/com/hpfxd/spectatorplus/fabric/sync/CustomPacketCodecs.java

      - name: Fix synced inventory contents, opening, and closing
        working-directory: source
        run: echo '' | base64 --decode | python3

      - name: Add BetterPOV automatic spectator switching
        working-directory: source
        run: |
          echo '' | base64 --decode > paper/paper-core/src/main/java/com/hpfxd/spectatorplus/paper/AutoSwitchSpectatorListener.java
          sed -i '/new SpectatorWorkarounds(this);/a\        new AutoSwitchSpectatorListener(this);' paper/paper-core/src/main/java/com/hpfxd/spectatorplus/paper/SpectatorPlugin.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build native 1.21.11 Fabric mod and Paper plugin
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :fabric:fabric-core:build :paper:paper-1.21.11:shadowJar --stacktrace

      - name: Prepare BetterPOV files
        working-directory: source
        shell: bash
        run: |
          mkdir -p dist
          fabric_jar=$(find fabric/fabric-core/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          paper_jar=$(find paper/paper-1.21.11/build/libs -maxdepth 1 -type f -name '*-all.jar' | head -1)
          test -n "$fabric_jar"
          test -n "$paper_jar"
          cp "$fabric_jar" dist/BetterPOV-Fabric-1.21.11-1.3.0.jar
          cp "$paper_jar" dist/BetterPOV-Paper-1.21.11-1.3.0.jar
          test "$(stat -c%s "$fabric_jar")" -gt 10000
          test "$(stat -c%s "$paper_jar")" -gt 10000
          ls -lh fabric/fabric-core/build/libs paper/paper-1.21.11/build/libs dist

      - uses: actions/upload-artifact@v4
        with:
          name: BetterPOV-1.21.11
          path: source/dist/*.jar
          if-no-files-found: error
