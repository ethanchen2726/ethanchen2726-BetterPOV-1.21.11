name: Build BetterPOV 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch native SpectatorPlus 1.21.11 source
        run: |
          curl -fsSL https://github.com/hpfxd/SpectatorPlus/archive/945b1938450c07631b0eb8b0d878b09c4218156e.zip -o spectatorplus.zip
          unzip -q spectatorplus.zip
          mv SpectatorPlus-945b1938450c07631b0eb8b0d878b09c4218156e source

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build native 1.21.11 Fabric mod and Paper plugin
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :fabric:fabric-1.21.11:build :paper:paper-1.21.11:build --stacktrace

      - name: Prepare BetterPOV files
        working-directory: source
        shell: bash
        run: |
          mkdir -p dist
          fabric_jar=$(find fabric/fabric-1.21.11/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          paper_jar=$(find paper/paper-1.21.11/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          test -n "$fabric_jar"
          test -n "$paper_jar"
          cp "$fabric_jar" dist/BetterPOV-Fabric-1.21.11-1.3.0.jar
          cp "$paper_jar" dist/BetterPOV-Paper-1.21.11-1.3.0.jar
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: BetterPOV-1.21.11
          path: source/dist/*.jar
          if-no-files-found: error
