name: Build BetterPOV 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch SpectatorPlus source
        run: git clone --depth 1 --branch mc/1.21.2 https://github.com/hpfxd/SpectatorPlus.git source

      - name: Port build configuration
        working-directory: source
        run: |
          sed -i 's/^version=.*/version=1.2.8+mc1.21.11-lunar-refmap/' gradle.properties
          sed -i 's/^minecraft_version=.*/minecraft_version=1.21.11/' fabric/gradle.properties
          sed -i 's/^loader_version=.*/loader_version=0.19.3/' fabric/gradle.properties
          sed -i 's/^fabric_version=.*/fabric_version=0.141.6+1.21.11/' fabric/gradle.properties
          sed -i 's/^fabric_permissions_api_version=.*/fabric_permissions_api_version=0.3.3/' fabric/gradle.properties
          sed -i 's/^cloth_config_version=.*/cloth_config_version=21.11.153/' fabric/gradle.properties
          sed -i 's/^modmenu_version=.*/modmenu_version=17.0.0-beta.2/' fabric/gradle.properties
          sed -i 's/id("fabric-loom") version "1.8-SNAPSHOT"/id("fabric-loom") version "1.17-SNAPSHOT"/' fabric/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          path = Path("fabric/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          text = text.replace("loom {\n", 'loom {\n    mixin {\n        useLegacyMixinAp = true\n        defaultRefmapName = "spectatorplus.refmap.json"\n    }\n\n', 1)
          path.write_text(text, encoding="utf-8")
          PY
          sed -i 's/gradle-8.10.2-bin.zip/gradle-9.5.0-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/this.setupSubproject("paper")/include("spectatorplus-paper"); project(":spectatorplus-paper").projectDir = file("paper")/' settings.gradle.kts
          sed -i 's/this.setupSubproject("fabric")/include("spectatorplus-fabric"); project(":spectatorplus-fabric").projectDir = file("fabric")/' settings.gradle.kts
          chmod +x gradlew
          python3 - <<'PY'
          import json
          path = "fabric/src/main/resources/fabric.mod.json"
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)
          data["name"] = "BetterPOV"
          data["description"] = "Better spectator POV for Minecraft 1.21.11, including the spectated player's hotbar, health, food, experience, held items, inventory, and container screens."
          data["contact"]["sources"] = "https://github.com/ethanchen2726/ethanchen2726-BetterPOV-1.21.11"
          data["depends"]["minecraft"] = "1.21.11"
          data["suggests"]["cloth-config"] = ">=21.11.153"
          data["suggests"]["modmenu"] = ">=17.0.0-beta.2"
          for mixin_path in (
              "fabric/src/main/resources/spectatorplus.mixins.json",
              "fabric/src/client/resources/spectatorplus.client.mixins.json",
          ):
              with open(mixin_path, encoding="utf-8") as mixin_fh:
                  mixin_data = json.load(mixin_fh)
              mixin_data["refmap"] = "spectatorplus.refmap.json"
              with open(mixin_path, "w", encoding="utf-8") as mixin_fh:
                  json.dump(mixin_data, mixin_fh, indent=2)
                  mixin_fh.write("\\n")
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2)
              fh.write("\n")
          PY
          echo '' | base64 --decode | git apply
          find fabric/src -name '*.java' -print0 | xargs -0 sed -i 's/net\.minecraft\.resources\.ResourceLocation/net.minecraft.resources.Identifier/g; s/ResourceLocation\.parse/Identifier.parse/g'
          sed -i 's/target\.getInventory()\.selected/target.getInventory().getSelectedSlot()/g' fabric/src/main/java/com/hpfxd/spectatorplus/fabric/sync/packet/ClientboundSelectedSlotSyncPacket.java
          sed -i 's/super(level, pos, yRot, gameProfile);/super(level, gameProfile);/' fabric/src/main/java/com/hpfxd/spectatorplus/fabric/mixin/ServerPlayerMixin.java
          sed -i 's/for (final ItemStack stack : target.getInventory().items) {/for (int betterpovSlot = 0; betterpovSlot < target.getInventory().getContainerSize(); betterpovSlot++) { final ItemStack stack = target.getInventory().getItem(betterpovSlot);/' fabric/src/main/java/com/hpfxd/spectatorplus/fabric/mixin/ServerPlayerMixin.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Fabric mod
        id: build
        continue-on-error: true
        working-directory: source
        run: ./gradlew :spectatorplus-fabric:build --stacktrace

      - name: Inspect Minecraft 1.21.11 mixin targets
        if: steps.build.outcome == 'failure'
        working-directory: source
        shell: bash
        run: |
          set +e
          echo "Mapped Minecraft jars:"
          find ~/.gradle/caches/fabric-loom -type f -name '*.jar' -print 2>/dev/null | sort
          mapfile -t jars < <(find ~/.gradle/caches/fabric-loom -type f -name '*.jar' 2>/dev/null)
          classes=(
            net.minecraft.client.gui.components.spectator.PlayerMenuItem
            net.minecraft.client.renderer.GameRenderer
            net.minecraft.client.renderer.ItemInHandRenderer
            net.minecraft.client.gui.Gui
            net.minecraft.client.gui.screens.inventory.AbstractContainerScreen
            net.minecraft.client.renderer.LevelRenderer
            net.minecraft.client.renderer.ScreenEffectRenderer
          )
          for class_name in "${classes[@]}"; do
            echo "===== $class_name ====="
            found=0
            for jar_path in "${jars[@]}"; do
              if javap -p -classpath "$jar_path" "$class_name" > /tmp/betterpov-javap.txt 2>/dev/null; then
                echo "JAR: $jar_path"
                cat /tmp/betterpov-javap.txt
                found=1
                break
              fi
            done
            if [[ $found -eq 0 ]]; then
              echo "Class not found in mapped cache"
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: BetterPOV-Fabric-1.21.11
          path: source/fabric/build/libs/*.jar
          if-no-files-found: error
