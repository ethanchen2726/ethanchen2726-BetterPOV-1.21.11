name: Build BetterPOV 26.2 Port

on:
  workflow_dispatch:
  push:
    branches: [ port-26.2 ]
    paths:
      - 'tools/port26.py'
      - 'tools/menu_sync_gate.py'
      - 'tools/remove_armor_overlay.py'
      - 'tools/fix_container_contents.py'
      - 'tools/fix_screen_tick_npe.py'
      - '.github/workflows/build-26.2.yml'
      - 'PORT_26_2.md'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port-26.2

      - name: Download recovered BetterPOV 1.21.11 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovery
          gh run download 34950818737 --repo "$GITHUB_REPOSITORY" --name BetterPOV-1.21.11-recovered-source --dir recovery
          unzip -q recovery/BetterPOV-1.21.11-recovered-source.zip -d .
          test -d source

      - name: Apply 26.2 mechanical port
        run: python3 tools/port26.py

      - name: Gate menu sync on the target Fabric client
        working-directory: source
        run: python3 ../tools/menu_sync_gate.py

      - name: Remove redundant top-right armor overlay
        working-directory: source
        run: python3 ../tools/remove_armor_overlay.py

      - name: Fix live container contents
        working-directory: source
        run: python3 ../tools/fix_container_contents.py

      - name: Fix synced-screen tick safety
        working-directory: source
        run: python3 ../tools/fix_screen_tick_npe.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Paper 26.2 and Fabric 26.2
        id: compile
        working-directory: source
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon :paper:paper-26.2:build --stacktrace 2>&1 | tee ../paper-26.2-build.log
          PAPER_STATUS=${PIPESTATUS[0]}
          ./gradlew --no-daemon :fabric:fabric-26.2:build --stacktrace 2>&1 | tee ../fabric-26.2-build.log
          FABRIC_STATUS=${PIPESTATUS[0]}
          echo "$PAPER_STATUS" > ../paper.status
          echo "$FABRIC_STATUS" > ../fabric.status
          exit 0

      - name: Smoke-test Fabric 26.2 client startup
        if: always()
        working-directory: source
        shell: bash
        run: |
          if [ "$(cat ../fabric.status)" != "0" ]; then
            echo "Skipping startup test because Fabric compilation failed"
            exit 0
          fi
          set +e
          timeout 120s xvfb-run -a ./gradlew --no-daemon :fabric:fabric-26.2:runClient 2>&1 | tee ../fabric-26.2-smoke.log
          SMOKE_STATUS=${PIPESTATUS[0]}
          set -e
          echo "$SMOKE_STATUS" > ../fabric-smoke.status
          if [ "$SMOKE_STATUS" != "0" ] && [ "$SMOKE_STATUS" != "124" ]; then
            echo "Fabric client exited unexpectedly with status $SMOKE_STATUS"
            exit "$SMOKE_STATUS"
          fi
          if grep -Eiq 'MixinTransformerError|MixinApplyError|InvalidInjectionException|Could not execute entrypoint|Exception in thread "Render thread"|Failed to start Minecraft' ../fabric-26.2-smoke.log; then
            echo "Fabric client log contains a fatal startup or mixin error"
            exit 1
          fi

      - name: Stage and validate release JARs
        if: always()
        run: |
          mkdir -p dist
          PAPER_JAR=$(find source/paper/paper-core/build/libs -maxdepth 1 -type f -name '*.jar' -size +10k | head -1)
          FABRIC_JAR=$(find source/fabric/fabric-core/build/libs -maxdepth 1 -type f -name '*mc26.2.jar' -size +10k | head -1)
          test -n "$PAPER_JAR"
          test -n "$FABRIC_JAR"
          cp "$PAPER_JAR" dist/BetterPOV-Paper-26.2-1.4.0.jar
          cp "$FABRIC_JAR" dist/BetterPOV-Fabric-26.2-1.4.0.jar
          unzip -p dist/BetterPOV-Fabric-26.2-1.4.0.jar fabric.mod.json > dist/fabric.mod.json
          unzip -Z1 dist/BetterPOV-Fabric-26.2-1.4.0.jar > dist/fabric-entries.txt
          unzip -p dist/BetterPOV-Paper-26.2-1.4.0.jar paper-plugin.yml > dist/paper-plugin.yml
          python3 - <<'PY'
          import json
          data = json.load(open('dist/fabric.mod.json'))
          assert data['depends']['minecraft'] == '26.2'
          assert data['depends']['java'] == '>=25'
          PY
          grep -q 'spectatorplus.client.mixins.json' dist/fabric-entries.txt
          grep -q 'ScreenSyncController.class' dist/fabric-entries.txt
          grep -q 'api-version: "26.2"' dist/paper-plugin.yml
          grep -q 'betterpov.spectate' dist/paper-plugin.yml
          sha256sum dist/*.jar | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Package current 26.2 source
        if: always()
        run: zip -qr BetterPOV-26.2-port-source.zip source

      - name: Upload port diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BetterPOV-26.2-port-diagnostics
          path: |
            paper-26.2-build.log
            fabric-26.2-build.log
            paper.status
            fabric.status
            fabric-smoke.status
            fabric-26.2-smoke.log
            BetterPOV-26.2-port-source.zip
            dist/*
          if-no-files-found: warn

      - name: Upload release JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BetterPOV-26.2-Fabric-and-Paper
          path: |
            dist/BetterPOV-Fabric-26.2-1.4.0.jar
            dist/BetterPOV-Paper-26.2-1.4.0.jar
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Fail if compilation failed
        if: always()
        run: |
          PAPER_STATUS=$(cat paper.status)
          FABRIC_STATUS=$(cat fabric.status)
          echo "Paper status: $PAPER_STATUS"
          echo "Fabric status: $FABRIC_STATUS"
          test "$PAPER_STATUS" = "0" && test "$FABRIC_STATUS" = "0"
